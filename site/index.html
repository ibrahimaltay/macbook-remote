<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1d1d1f; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #1d1d1f; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg"><rect x="450" y="120" width="300" height="560" rx="48" fill="#fff"></rect><circle cx="600" cy="400" r="70" fill="#0071e3"></circle></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <template id="app-demos">
    <section aria-labelledby="demo-heading" style="margin:2.5rem 0 0">
      <h2 id="demo-heading" style="font-size:1.4rem;margin:0 0 1rem">See It in Action</h2>
      <figure style="margin:0 0 1.75rem">
        <figcaption style="margin:0 0 0.5rem;font-weight:600">Trackpad</figcaption>
        <img src="readme-gifs/trackpad.gif" width="960" height="540" alt="Using the iPhone trackpad to control the Mac cursor" decoding="async" style="display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:8px">
      </figure>
      <figure style="margin:0 0 1.75rem">
        <figcaption style="margin:0 0 0.5rem;font-weight:600">Arrow Keys</figcaption>
        <img src="readme-gifs/arrow-keys.gif" width="960" height="540" alt="Controlling the Mac with the iPhone arrow keys" loading="lazy" decoding="async" style="display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:8px">
      </figure>
      <figure style="margin:0 0 1.75rem">
        <figcaption style="margin:0 0 0.5rem;font-weight:600">Play / Pause</figcaption>
        <img src="readme-gifs/play-pause.gif" width="960" height="540" alt="Pausing and resuming Mac playback from the iPhone" loading="lazy" decoding="async" style="display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:8px">
      </figure>
      <figure style="margin:0">
        <figcaption style="margin:0 0 0.5rem;font-weight:600">Keyboard</figcaption>
        <img src="readme-gifs/keyboard.gif" width="960" height="540" alt="Sending text from the iPhone keyboard to the Mac" loading="lazy" decoding="async" style="display:block;width:100%;height:auto;aspect-ratio:16/9;border-radius:8px">
      </figure>
    </section>
  </template>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    const demos = document.getElementById('app-demos');
    const featuresHeading = '<h2 style="font-size:1.4rem;margin:2.5rem 0 0.5rem">Features</h2>';
    if (!demos || !template.includes(featuresHeading)) {
      throw new Error('Missing homepage demo insertion point');
    }
    template = template.replace(featuresHeading, demos.innerHTML + featuresHeading);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    doc.querySelector('main[data-screen-label="Home"] img[alt="LazyRemote with a trackpad, arrow keys, play/pause and a text field"]')?.remove();
    const macDownload = doc.querySelector('a[href$="/LazyRemote.dmg"]');
    const downloads = macDownload.parentElement;
    downloads.style.cssText = 'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;width:100%;align-items:start';
    macDownload.style.height = '4.5rem';
    macDownload.style.width = '100%';
    macDownload.style.maxWidth = '13.5rem';
    macDownload.style.justifyContent = 'center';
    macDownload.style.padding = '0 0.75rem';
    macDownload.querySelector('svg').setAttribute('width', '28');
    macDownload.querySelector('svg').setAttribute('height', '28');
    macDownload.querySelector('span > span').style.fontSize = '1.4rem';
    const appStoreImage = downloads.querySelector('img[alt="App Store, coming soon"]');
    const appStoreBadge = appStoreImage.parentElement;
    appStoreBadge.style.cssText = 'position:relative;display:block;width:100%;max-width:13.5rem;aspect-ratio:3/1;border-radius:9px;overflow:hidden';
    appStoreImage.style.cssText = 'display:block;width:100%;height:auto';
    appStoreBadge.parentElement.style.cssText = 'display:flex;flex-direction:column;align-items:flex-start;gap:0.5rem;min-width:0;cursor:default';
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"9b5a144f-ba8e-4840-9034-a10f519cdcb8\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n<style>\n*{box-sizing:border-box}\nbody{margin:0;font:17px/1.55 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;color:#1d1d1f;background:#fff;-webkit-text-size-adjust:100%}\na{color:#0071e3;text-decoration:none}a:hover{text-decoration:underline}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:#fff;color:#1d1d1f\">\n<header style=\"position:sticky;top:0;z-index:10;background:#1d1d1f;border-bottom:1px solid #000\">\n<div style=\"max-width:44rem;margin:0 auto;padding:0.9rem 1.25rem;display:flex;justify-content:space-between;align-items:center\">\n<a href=\"#\" sc-camel-on-click=\"{{ goHome }}\" style=\"font-weight:600;color:#fff;text-decoration:none\">LazyRemote<\u002Fa>\n<nav style=\"display:flex;gap:1.25rem\">\n<a href=\"#\" sc-camel-on-click=\"{{ goSupport }}\" style=\"color:#a1a1a6;text-decoration:none\" style-hover=\"color:#fff\">Support<\u002Fa>\n<a href=\"#\" sc-camel-on-click=\"{{ goPrivacy }}\" style=\"color:#a1a1a6;text-decoration:none\" style-hover=\"color:#fff\">Privacy<\u002Fa>\n<\u002Fnav>\n<\u002Fdiv>\n<\u002Fheader>\n\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<main data-screen-label=\"Home\" style=\"max-width:44rem;margin:0 auto;padding:0 1.25rem\">\n<h1 style=\"font-size:2.4rem;line-height:1.15;margin:2.5rem 0 0.75rem;letter-spacing:-0.02em\">Use your iPhone as a remote for your Mac.<\u002Fh1>\n<p style=\"font-size:1.2rem;color:#6e6e73;margin:0 0 1.5rem\">Arrow keys, trackpad and keyboard, over Bluetooth. No Wi-Fi setup, no accounts. <a href=\"#\" sc-camel-on-click=\"{{ goSupport }}\" style=\"color:#0071e3;text-decoration:none;font-weight:600;white-space:nowrap\" style-hover=\"text-decoration:underline\">Get started →<\u002Fa><\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:1.5rem;margin:2.5rem 0 0;align-items:center\">\n<img src=\"20a252dd-24cf-4316-99d6-e07ac83e01ec\" width=\"1179\" height=\"2556\" alt=\"LazyRemote with a trackpad, arrow keys, play/pause and a text field\" style=\"flex:0 0 auto;width:min(13rem,70vw);height:auto;border-radius:1.5rem;border:1px solid #e5e5ea\">\n<div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:1rem\">\n<a href=\"https://github.com/ibrahimaltay/lazy-remote-for-desktop/releases/latest/download/LazyRemote.dmg\" style=\"display:inline-flex;align-items:center;gap:0.75rem;height:2.9rem;box-sizing:border-box;padding:0 1.3rem 0 1rem;border-radius:9px;background:#000;border:1px solid #a6a6a6;color:#fff;text-decoration:none;line-height:1.1\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12M6.5 10.5 12 16l5.5-5.5M5 20h14\"><\u002Fpath><\u002Fsvg><span style=\"display:flex;flex-direction:column;line-height:1.1\"><span style=\"font-size:1.15rem;font-weight:600\">MacOS<\u002Fspan><span style=\"font-size:0.68rem;letter-spacing:0.02em;color:#a1a1a6\">Apple Silicon<\u002Fspan><\u002Fspan><\u002Fa>\n<div sc-camel-on-mouse-enter=\"{{ soonOn }}\" sc-camel-on-mouse-leave=\"{{ soonOff }}\" style=\"display:flex;align-items:center;gap:0.8rem;cursor:default\"><div style=\"position:relative;display:inline-block;border-radius:9px;overflow:hidden\"><img src=\"3a3dd514-fd48-4ad6-a2f5-7cc63a915de3\" alt=\"App Store, coming soon\" style=\"display:block;height:2.9rem;width:auto\"><div style=\"position:absolute;inset:0;background:rgba(245,245,247,0.6);backdrop-filter:grayscale(1) blur(1px);transition:opacity .2s;opacity:{{ soonOp }}\"><\u002Fdiv><\u002Fdiv><span style=\"display:flex;flex-direction:column;line-height:1.2;transition:opacity .2s,transform .2s;opacity:{{ soonOp }};transform:translateX({{ soonX }})\"><span style=\"font-size:0.95rem;font-weight:600;color:#1d1d1f\">Coming soon<\u002Fspan><span style=\"font-size:0.75rem;color:#6e6e73\">iPhone app<\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h2 style=\"font-size:1.4rem;margin:2.5rem 0 0.5rem\">Features<\u002Fh2>\n<ul style=\"padding-left:1.25rem\">\n<li style=\"margin:0.35rem 0\"><strong>Arrow keys and play/pause:<\u002Fstrong> control videos and presentations without leaving your seat.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>Trackpad:<\u002Fstrong> move the cursor; tap to click, two-finger double-tap to right-click.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>Keyboard:<\u002Fstrong> type on your iPhone and send the text straight to your Mac.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>Direct and encrypted:<\u002Fstrong> connects over Bluetooth, with no Wi-Fi setup or accounts.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>Free:<\u002Fstrong> no ads, no tracking, no in-app purchases.<\u002Fli>\n<\u002Ful>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSupport }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Support\" style=\"max-width:44rem;margin:0 auto;padding:0 1.25rem\">\n<h1 style=\"font-size:2.4rem;line-height:1.15;margin:2.5rem 0 0.75rem;letter-spacing:-0.02em\">Support<\u002Fh1>\n<h2 style=\"font-size:1.4rem;margin:2.5rem 0 0.5rem\">Installation<\u002Fh2>\n<h3 style=\"font-size:1.1rem;margin:1.5rem 0 0.25rem\">iPhone<\u002Fh3>\n<p>The iPhone app will be on the App Store soon.<\u002Fp>\n<h3 style=\"font-size:1.1rem;margin:1.5rem 0 0.25rem\">Mac<\u002Fh3>\n<ol style=\"padding-left:1.25rem\">\n<li style=\"margin:0.35rem 0\">Download <a href=\"https://github.com/ibrahimaltay/lazy-remote-for-desktop/releases/latest/download/LazyRemote.dmg\">LazyRemote.dmg<\u002Fa>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Open <strong>LazyRemote.dmg<\u002Fstrong>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Drag <strong>LazyRemote<\u002Fstrong> into the <strong>Applications<\u002Fstrong> folder.<\u002Fli>\n<\u002Fol>\n<h2 style=\"font-size:1.4rem;margin:2.5rem 0 0.5rem\">Quickstart<\u002Fh2>\n<ol style=\"padding-left:1.25rem\">\n<li style=\"margin:0.35rem 0\">On your Mac, open <strong>LazyRemote<\u002Fstrong>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">When macOS asks for Bluetooth access, select <strong>Allow<\u002Fstrong>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Make sure that the LazyRemote icon comes into view in the menu bar.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Click the LazyRemote icon.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Select <strong>Open Accessibility Settings…<\u002Fstrong>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Set <strong>LazyRemote<\u002Fstrong> to on.<\u002Fli>\n<li style=\"margin:0.35rem 0\">On your iPhone, open <strong>LazyRemote<\u002Fstrong>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">When iOS asks for Bluetooth access, select <strong>Allow<\u002Fstrong>.<\u002Fli>\n<li style=\"margin:0.35rem 0\">On your Mac, click the LazyRemote icon in the menu bar.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Select <strong>Allow<\u002Fstrong> followed by the name of your iPhone.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Make sure that the iPhone shows the name of your Mac with a green dot.<\u002Fli>\n<li style=\"margin:0.35rem 0\">Use the trackpad and the buttons below it to control your Mac. To type, tap <strong>Type to send<\u002Fstrong> and then select the send button.<\u002Fli>\n<\u002Fol>\n<h2 style=\"font-size:1.4rem;margin:2.5rem 0 0.5rem\">Troubleshooting<\u002Fh2>\n<h3 style=\"font-size:1.1rem;margin:1.5rem 0 0.25rem\">Buttons do nothing on the Mac<\u002Fh3>\n<p>LazyRemote needs Accessibility access to send key presses and clicks. Open <strong>System Settings › Privacy &amp; Security › Accessibility<\u002Fstrong> and make sure <strong>LazyRemote<\u002Fstrong> is on. If it already is, turn it off and on again, then restart LazyRemote.<\u002Fp>\n<h3 style=\"font-size:1.1rem;margin:1.5rem 0 0.25rem\">The iPhone can't find the Mac<\u002Fh3>\n<ul style=\"padding-left:1.25rem\">\n<li style=\"margin:0.35rem 0\">Make sure Bluetooth is on for both devices, and that both apps have Bluetooth permission (iPhone: <strong>Settings › LazyRemote<\u002Fstrong>; Mac: <strong>System Settings › Privacy &amp; Security › Bluetooth<\u002Fstrong>).<\u002Fli>\n<li style=\"margin:0.35rem 0\">Make sure LazyRemote is running and enabled in the Mac menu bar.<\u002Fli>\n<li style=\"margin:0.35rem 0\">On the iPhone, tap the <strong>…<\u002Fstrong> menu and select <strong>Reconnect<\u002Fstrong>.<\u002Fli>\n<\u002Ful>\n<h3 style=\"font-size:1.1rem;margin:1.5rem 0 0.25rem\">The connection is refused after reinstalling<\u002Fh3>\n<p>For security, LazyRemote refuses a Mac or iPhone whose identity has changed. To pair again, select <strong>Forget Mac<\u002Fstrong> in the iPhone's <strong>…<\u002Fstrong> menu, select <strong>Remove<\u002Fstrong> next to the iPhone in the Mac menu bar, and then pair again.<\u002Fp>\n<h2 style=\"font-size:1.4rem;margin:2.5rem 0 0.5rem\">Contact<\u002Fh2>\n<p>Report a problem or ask a question at <a href=\"https://github.com/ibrahimaltay/lazy-remote-for-desktop/issues\">github.com/ibrahimaltay/lazy-remote-for-desktop/issues<\u002Fa>.<\u002Fp>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPrivacy }}\" hint-placeholder-val=\"{{ false }}\">\n<main data-screen-label=\"Privacy\" style=\"max-width:44rem;margin:0 auto;padding:0 1.25rem\">\n<h1 style=\"font-size:2.4rem;line-height:1.15;margin:2.5rem 0 0.75rem;letter-spacing:-0.02em\">Privacy Policy<\u002Fh1>\n<p style=\"color:#6e6e73\">Last updated: October 5, 2026<\u002Fp>\n<p>LazyRemote does not collect, store, or share any personal data.<\u002Fp>\n<ul style=\"padding-left:1.25rem\">\n<li style=\"margin:0.35rem 0\"><strong>No accounts, analytics, ads, or tracking.<\u002Fstrong> The app contains no third-party SDKs.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>Bluetooth.<\u002Fstrong> The iPhone app uses Bluetooth only to connect directly to your own Mac and send remote-control input (button presses, pointer movement, text). This traffic is end-to-end encrypted and never leaves your devices or passes through any server.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>On-device storage.<\u002Fstrong> Pairing keys are stored in the Keychain, and app preferences are stored locally on your device. They are never transmitted to us.<\u002Fli>\n<li style=\"margin:0.35rem 0\"><strong>Children.<\u002Fstrong> The app does not knowingly collect information from anyone, including children under 13.<\u002Fli>\n<\u002Ful>\n<p>This website uses no cookies, analytics, or third-party resources.<\u002Fp>\n<p>If this policy changes, the updated version will be posted at this URL.<\u002Fp>\n<h2 style=\"font-size:1.4rem;margin:2.5rem 0 0.5rem\">Contact<\u002Fh2>\n<p>Questions about this policy can be submitted as an issue at <a href=\"https://github.com/ibrahimaltay/lazy-remote-for-desktop/issues\">github.com/ibrahimaltay/lazy-remote-for-desktop/issues<\u002Fa>.<\u002Fp>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<footer style=\"max-width:44rem;margin:4rem auto 0;padding:1.5rem 1.25rem 2rem;border-top:1px solid #e5e5ea;color:#6e6e73;font-size:0.9rem;display:flex;flex-wrap:wrap;gap:1rem\">\n<a href=\"#\" sc-camel-on-click=\"{{ goSupport }}\">Support<\u002Fa>\n<a href=\"#\" sc-camel-on-click=\"{{ goPrivacy }}\">Privacy<\u002Fa>\n<a href=\"https://github.com/ibrahimaltay/lazy-remote-for-desktop\">GitHub<\u002Fa>\n<span>MIT License<\u002Fspan>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;support&quot;,&quot;privacy&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: null, soon: false };\n  renderVals() {\n    const page = this.state.page ?? this.props.page ?? 'home';\n    const go = p => e => { e.preventDefault(); this.setState({ page: p }); window.scrollTo(0, 0); };\n    return {\n      isHome: page === 'home', isSupport: page === 'support', isPrivacy: page === 'privacy',\n      soonOp: this.state.soon ? 1 : 0, soonX: this.state.soon ? '0' : '-6px', soonOn: () => this.setState({ soon: true }), soonOff: () => this.setState({ soon: false }),\n      goHome: go('home'), goSupport: go('support'), goPrivacy: go('privacy'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
